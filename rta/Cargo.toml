[package]
name = "rta"
edition = "2024"
version = "0.0.2"
readme = "../README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frozen-lab/rta"
categories = ["caching", "database-implementations"]
keywords = ["rta", "database", "persistence", "storage"]
description = "Ṛta (ऋत) is a minimal metadata store for durable system state"

[dependencies]
frozen-core = {version = "0.0.5", default-features = true}
rta-derive = {version = "0.2", path = "../rta-derive"}

[dev-dependencies]
tempfile = "3.20.0"
