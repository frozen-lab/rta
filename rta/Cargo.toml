[package]
name = "rta"
edition = "2024"
version = "0.0.2"
rust-version = "1.86.0"
description = "Ṛta (ऋत) is a minimal metadata store for durable system state"
readme = "../README.md"
keywords = [
    "rta",
    "database",
    "persistence",
    "storage",
]
categories = [
    "caching",
    "database-implementations",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/frozen-lab/rta"
exclude = [
    ".github/",
    "shell.nix",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
additional-targets = ["i686-apple-darwin"]

[lib]
name = "rta"
path = "src/lib.rs"

[dependencies.frozen-core]
version = "0.0.30"
default-features = false
features = [
    "ack",
    "error",
    "hints",
    "crc32",
    "fmmap",
]

[dependencies.rta-derive]
version = "0.3.0"

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.hdrhistogram]
version = "7.5.4"

[[bench]]
name = "write"
harness = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "durable_write"
harness = false
