[package]
edition = "2024"
name = "rta-derive"
version = "0.3.0"
build = false
description = "Macro implementation for Ṛta"
readme = "README.md"
keywords = [
    "rta",
    "database",
    "persistence",
    "storage",
]
categories = [
    "caching",
    "database-implementations",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/frozen-lab/rta"

[lib]
name = "rta_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0"

[dependencies.quote]
version = "1.0"

[dependencies.syn]
version = "2.0"
